<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KNYT Admin</title>
</head>
<body>

<h1>KNYT Admin</h1>

<form id="login-form">
  <input
    type="email"
    id="email"
    placeholder="E-mail"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Jelszó"
    required
  >

  <button type="submit">
    Bejelentkezés
  </button>
</form>

<p id="message"></p>

<script type="module" src="/admin/auth.js"></script>

</body>
</html>
